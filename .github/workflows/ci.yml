name: Rust CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-readme-only:
    name: Detect README-only commits
    runs-on: ubuntu-latest
    outputs:
      only_readme: ${{ steps.check.outputs.only_readme }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            has_code_changes:
              - '**'
              - '!README.md'
              - '!LICENSE'
              - '!docs/**'
              - '!.gitignore'

      - name: Set output flag
        id: check
        shell: bash
        run: |
          if [ "${{ steps.filter.outputs.has_code_changes }}" = "true" ]; then
            echo "only_readme=false" >> "$GITHUB_OUTPUT"
            echo "Code changes detected. Build required."
          else
            echo "only_readme=true" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed. Skipping build."
          fi

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    needs: check-readme-only
    if: needs.check-readme-only.outputs.only_readme == 'false'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-14]
        rust: [stable]
        features: [""]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode on macOS
        if: startsWith(matrix.os, 'macos')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Limit parallel jobs on macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-no_pie" >> "$GITHUB_ENV"
          echo "Limiting parallelism to reduce memory usage"

      - name: Install GPU test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y spirv-tools mesa-vulkan-drivers libvulkan1
          echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"

      - name: Build project
        shell: bash
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo build --locked --jobs "${CARGO_BUILD_JOBS:-4}"
          else
            cargo build --locked --jobs "${CARGO_BUILD_JOBS:-4}" --features "${{ matrix.features }}"
          fi

      # Also runs core/tests/suites.rs.
      - name: Run test suite
        shell: bash
        env:
          RUST_BACKTRACE: full
        run: |
          if [[ -z "${{ matrix.features }}" ]]; then
            cargo test --locked --verbose
          else
            cargo test --locked --verbose --features "${{ matrix.features }}"
          fi

  gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: check-readme-only
    if: needs.check-readme-only.outputs.only_readme == 'false'

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_VERSION: '6.12.*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Command Line Tools linker (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo xcode-select --switch /Library/Developer/CommandLineTools
          xcode-select -p
          xcrun --find ld

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      - name: Install Qt (Linux and macOS)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: '==3.3.*'
          cache: true

      - name: Configure (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test, headless (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          code=0
          timeout 10 ./build/oboromi || code=$?

          if [ "$code" -ne 124 ]; then
            echo "GUI exited early with code $code"
            exit 1
          fi

      - name: Smoke test, headless (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./build/oboromi &
          pid=$!
          sleep 10

          if kill -0 "$pid" 2>/dev/null; then
            kill "$pid"
            wait "$pid" || true
          else
            code=0
            wait "$pid" || code=$?
            echo "GUI exited early with code $code"
            exit 1
          fi

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [check-readme-only, build]
    if: needs.check-readme-only.outputs.only_readme == 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: ${{ runner.os }}-cargo-bin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bin-

      - name: Install tarpaulin if missing
        run: |
          if ! command -v cargo-tarpaulin &> /dev/null; then
            cargo install cargo-tarpaulin
          fi

      - name: Generate coverage report
        run: cargo tarpaulin --out Xml --output-dir target/coverage --release

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./target/coverage/cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
