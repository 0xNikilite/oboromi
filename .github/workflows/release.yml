name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Tag to create, e.g. v0.0.1
        required: true
        type: string
      prerelease:
        description: Mark as a prerelease
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}

env:
  CARGO_BUILD_JOBS: 3
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: oboromi-linux-x64.tar.gz
          - runner: windows-2025
            asset: oboromi-windows-x64.zip
          - runner: macos-15
            asset: oboromi-macos-universal.dmg
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        run: rustup default stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config libclang-dev qt6-base-dev

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          cache: true

      - name: Build and package Linux
        if: runner.os == 'Linux'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD_LIBRARIES=-latomic
          cmake --build build --parallel 3
          mkdir -p dist/oboromi
          install -m 755 build/oboromi dist/oboromi/oboromi
          cp README.md license.txt dist/oboromi/
          tar -czf oboromi-linux-x64.tar.gz -C dist oboromi

      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR"
          cmake --build build --parallel 3
          New-Item -ItemType Directory -Path dist/oboromi
          Copy-Item build/oboromi.exe, README.md, license.txt -Destination dist/oboromi
          windeployqt --release --no-translations dist/oboromi/oboromi.exe
          Compress-Archive -Path dist/oboromi -DestinationPath oboromi-windows-x64.zip

      - name: Build and package macOS Universal
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          for arch in arm64 x86_64; do
            target="$arch"
            if [ "$arch" = arm64 ]; then target=aarch64; fi
            cmake -S . -B "build-$arch" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_MACOSX_BUNDLE=ON "-DCMAKE_OSX_ARCHITECTURES=$arch" \
              "-DRust_CARGO_TARGET=$target-apple-darwin" "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR"
            cmake --build "build-$arch" --parallel 3
          done
          ditto build-arm64/oboromi.app oboromi.app
          lipo -create build-arm64/oboromi.app/Contents/MacOS/oboromi \
            build-x86_64/oboromi.app/Contents/MacOS/oboromi \
            -output oboromi.app/Contents/MacOS/oboromi
          lipo -verify_arch arm64 x86_64 oboromi.app/Contents/MacOS/oboromi
          mkdir -p oboromi.app/Contents/Resources
          cp README.md license.txt oboromi.app/Contents/Resources/
          macdeployqt oboromi.app -dmg
          mv oboromi.dmg oboromi-macos-universal.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--target "$GITHUB_SHA" --title "$VERSION" --generate-notes)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "${args[@]}" -- "$VERSION" \
            artifacts/oboromi-linux-x64.tar.gz \
            artifacts/oboromi-windows-x64.zip \
            artifacts/oboromi-macos-universal.dmg
