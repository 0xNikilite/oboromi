[package]
name = "oboromi-core"
version = "0.0.1"
edition = "2024"
authors = ["Nikilite", "Elizabeth"]
license = "GPL-3.0"
description = "Core emulator library for oboromi"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2.177"
memmap2 = "0.9.9"
log = { workspace = true }
ash = "0.38.0"

rapid-arm-emu = { git = "https://codeberg.org/Nikilite/rapid-arm-emu", rev = "506144d74d71c8f2bc05c32c9ebefe0d93cf79ba" }
tempfile = "3"

[features]
default = []
trace = []
