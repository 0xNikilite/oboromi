[package]
name = "oboromi-core"
version = "0.0.1"
edition = "2024"
authors = ["Nikilite", "Elizabeth"]
license = "GPL-3.0"
description = "Core emulator library for oboromi"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2.177"
memmap2 = "0.9.9"
log = { workspace = true }
ash = "0.38.0"
thiserror = "2.0"
byteorder = "1.5"

[features]
default = []
trace = []
