site_name: oboromi
site_description: How the oboromi Switch 2 emulator is built
site_url: https://jopdorp.github.io/oboromi/
docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/brand/oboromi-logo.png
  favicon: assets/brand/oboromi-logo.png
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

extra_css:
  - assets/stylesheets/oboromi.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

nav:
  - Home: index.md
  - Architecture:
      - architecture/README.md
      - Emulator overview: architecture/oboromi-overview.md
      - GPU pipeline: architecture/gpu-pipeline.md
      - SASS translator: architecture/sass-translator.md
      - Vulkan backend: architecture/vulkan-backend.md
      - Command processor and memory: architecture/command-processor-and-memory.md
      - Textures and tensors: architecture/textures-and-tensors.md
      - Verification: architecture/verification.md
      - CUDA: architecture/cuda.md
      - Demos: architecture/demos.md
      - Roadmap: architecture/roadmap.md
  - Decisions:
      - adr/README.md
      - One table of data slots: adr/0001-set-0-binding-abi.md
      - One memory window: adr/0002-one-ssbo-window-for-global-memory.md
      - Diverged threads take turns: adr/0003-uniform-workgroup-scheduling-for-divergence.md
      - RAM is the one true copy: adr/0004-backing-memory-authority-for-coherence.md
      - Exact matrix sums as loops: adr/0005-hmma-exact-accumulation-as-dontunroll-loops.md
      - Commands run in order: adr/0006-synchronous-pusher-with-draw-snapshots.md
      - Switch 2 uses the desktop table: adr/0007-t239-decodes-with-the-sm86-table.md
      - Real chips are the reference: adr/0008-silicon-first-verification.md
  - Glossary: glossary.md
  - SM86 instruction table (PDF): sm86.pdf

extra:
  status:
    accepted: Accepted decision
